# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/source/conf.py

formats: [htmlzip]

python:
   install:
   - requirements: docs/source/sphinx/requirements.txt

build:
   os: ubuntu-22.04
   tools:
      python: "3.13"
   jobs:
     pre_install:
       - pip install "cmake<4.0"
       - pip install torch==2.11.0  # The latest version
       - bash -c "cd $READTHEDOCS_REPOSITORY_PATH && pip install ."
       - bash -c "cd docs && ./install_requirements.sh"
     build:
       htmlzip:
         - echo "Overriding default build command for htmlzip format to use Quark doc build script!"
         - echo "Copying tutorials from root to docs/source/tutorials/ for Sphinx build"
         - bash -c "if [ -d $READTHEDOCS_REPOSITORY_PATH/tutorials ]; then rm -rf $READTHEDOCS_REPOSITORY_PATH/docs/source/tutorials; cp -r $READTHEDOCS_REPOSITORY_PATH/tutorials $READTHEDOCS_REPOSITORY_PATH/docs/source/tutorials; else echo 'Warning: tutorials folder not found at root'; fi"
         - mkdir -p $READTHEDOCS_OUTPUT/html
         - bash -c "export QUARK_SPHINX_SKIP_BUILD_TUTORIALS=1; cd docs && ./build_docs.sh"
         - bash -c "cp -rv _docs_build/html/* $READTHEDOCS_OUTPUT/html/"
