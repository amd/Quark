# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/source/conf.py

python:
   install:
   - requirements: docs/source/sphinx/requirements.txt

build:
   os: ubuntu-22.04
   tools:
      python: "3.13"
   jobs:
     pre_install:
       - pip install "cmake<4.0"
       # CPU torch, onnxruntime and transformers are needed for autodoc to import the full public quark.torch / quark.onnx API
       - bash -c "cd docs && ./install_requirements.sh --include-torch --include-onnxruntime --include-transformers"
       # Reuse the CPU torch installed above instead of pulling the CUDA torch wheel into an isolated build env
       - bash -c "cd $READTHEDOCS_REPOSITORY_PATH && pip install --no-build-isolation ."
     build:
       html:
         - echo "Overriding default build command for html format to use Quark doc build script!"
         - mkdir -p $READTHEDOCS_OUTPUT/html
         # ci_doc.yml sets the same variable. build_docs.sh then passes --fail-on-warning,
         # so an autodoc ImportError or ModuleNotFoundError fails this build instead of publishing an empty page.
         - bash -c "export QUARK_SPHINX_SKIP_BUILD_TUTORIALS=1 QUARK_DOC_FAIL_ON_WARNING=1; cd docs && ./build_docs.sh"
         - bash -c "cp -rv _docs_build/html/* $READTHEDOCS_OUTPUT/html/"
