match:
  failure_class: [accuracy_gap]
  keywords: [fp8, identity, synthetic, dequantize_weight, get_and_maybe_dequant_weights]
summary: Recover stored quantized weights without applying activation quantization to synthetic inputs.
guidance:
  - Trace derived-weight construction to determine whether it executes the quantized layer on an identity matrix.
  - Compare the recovered weight with a direct reference dequantization of the stored weight and weight scale.
  - Do not recalibrate or globally replace a valid static activation scale to accommodate a synthetic input.
  - Prefer an optional quant-method hook that directly dequantizes stored weights.
  - Retain identity-based recovery only for quantization methods that do not provide direct weight dequantization.
  - Re-run load, inference, and the original real quantized accuracy gate.
required_checks: [weight_reference, load, inference, accuracy]
