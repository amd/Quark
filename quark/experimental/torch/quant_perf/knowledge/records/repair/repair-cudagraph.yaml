schema_version: 1
id: repair.vllm.cudagraph-lifecycle.v1
domain: repair
kind: diagnostic_playbook
status: validated
applicability:
  framework: [vllm]
match:
  symptoms:
    - runtimeerror: cancelled
    - memory access fault
    - garbage outputs
  keywords: [cudagraph, workspace, lazy init, scratch, capture, replay]
summary: Exonerate the kernel first, then inspect allocations, lazy state, and workspace growth inside graph capture.
guidance:
  - Run the kernel unit tests before instrumenting kernel code.
  - Use eager, no-cudagraph, and no-compile rungs to isolate the failing subsystem.
  - Prewarm maximum capacity and every scheduler-visible shape; allocate scratch before capture.
required_checks: [kernel_unit, load, inference, accuracy]
evidence:
  level: E3
