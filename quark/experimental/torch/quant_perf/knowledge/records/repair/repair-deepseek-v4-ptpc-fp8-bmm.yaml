summary: Apply Quark PTPC-FP8 scales and preserve grouped weight layout in the DeepSeek V4 ROCm output projection.
guidance:
  - When decoding repeats tokens despite finite activations, compare native and exported intermediate tensors to find the first numerical divergence before blaming CUDA Graphs or the quantization recipe.
  - In the validated case, embeddings and Q/KV projections agreed, but the input to wo_b had RMS 2817.2529 versus native 0.58049; divergence began at the wo_a grouped projection.
  - The specialized native path recognizes weight_scale_inv, while Quark PTPC-FP8 stores weight_scale. Ordinary linear postprocessing also transposes or shuffles weights, which a direct grouped reshape cannot interpret correctly.
  - For the supported ROCm PTPC-FP8 BMM path, retain checkpoint-order weights with shape [G*N, K], apply compatible FP8 weight/scale normalization, and quantize activations dynamically per token.
  - Invoke a BMM accepting FP8 operands with shapes [G, T, K] and [G, N, K], per-token activation scales and per-output-channel weight scales; restore output order [T, G, N].
  - Route the specialized output projection through the Quark BMM method rather than the native cached-BF16 helper. Guard the supported scheme explicitly and preserve other output-projection paths.
  - Verify the chosen kernel's dtype contract. The attempted AITER CK batched interface rejected FP8 because it required INT8; the existing AITER Triton batched_gemm_a8w8 accepted FP8 without changing precision or AITER source.
  - Inspect scale access bounds for partial tiles. The selected Triton interface required padded scale storage for unmasked loads; retain the logical tensor dimensions and validate boundary token counts.
  - Use an independent scaled-matmul reference, cover token counts 1, 19 and 257 in eager and CUDA Graph replay, check full-model text output, then rerun the original full offline accuracy gate.
  - A search label such as attention_mode=native does not establish each exported projection's precision; resolve wo_a, wo_b and compressor rules from the actual exported configuration.
  - Treat this as a numerical-correctness repair. The combined runtime completed full accuracy, but this does not independently identify the earlier asynchronous memory-access fault or establish a throughput improvement.
required_checks: [weight_layout, scale_application, projection_numerics, partial_tile_bounds, cuda_graph_replay, load, inference, accuracy]
