schema_version: 1
id: repair.vllm.long-context-oom.v1
domain: repair
kind: diagnostic_playbook
status: validated
applicability:
  framework: [vllm]
match:
  symptoms:
    - torch.outofmemoryerror
    - enginedeaderror
    - long-context oom
  keywords: [float, contiguous, torch.cat, workspace, memory snapshot]
summary: Find the context-length boundary and remove transient widening, copies, and per-layer scratch amplification.
guidance:
  - Bisect the failing context length before editing.
  - Capture peak-memory evidence and audit float casts, contiguous copies, cat, and matmul allocations.
  - Prefer preallocated output buffers and shared workspaces, then re-bisect the boundary.
required_checks: [memory_boundary, load, inference]
evidence:
  level: E2
