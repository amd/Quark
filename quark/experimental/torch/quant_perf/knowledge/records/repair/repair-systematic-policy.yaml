summary: Trace backward to the first invalid state, verify assumptions, and change one confirmed cause at a time.
guidance:
  - Reproduce and capture a comparable baseline before profiling or editing.
  - Mark each load-bearing assumption as verified or assumed.
  - Stop after several grounded hypotheses if the causal chain remains incomplete.
  - Never declare success without rerunning the original repro and a golden-path request.
required_checks: [original_repro, golden_path]
