      framework_version: 0.25.0+rocm723
      accelerator: gfx950
      tensor_parallel_size: 2
      weight_block_size: [128, 128]
      activation_group_size: 128
      weight_scale_dtype: float8_e8m0fnu
      result: block_fp8_scheme_selected_and_combined_repaired_runtime_passed_full_offline_gsm8k
      verification_scope: The final runtime included the subsequent V4 mapping, compressor and grouped-output repairs.
      session_artifacts:
