schema_version: 1
id: repair.quark.weight-name-mapper.v1
domain: repair
kind: diagnostic_playbook
status: validated
applicability:
  framework: [vllm]
match:
  symptoms:
    - per-layer config in layer_quant_config has no effect
    - excluded layers from the quark config are still being treated as quantized
  keywords: [WeightsMapper, apply_weight_name_mapper, exclude_layers, layer_quant_config]
summary: Align Quark HF layer names with the runtime vLLM module tree before matching excludes or overrides.
guidance:
  - Inspect the model's existing WeightsMapper bridge.
  - Remap both exclude entries and layer_quant_config keys through the general mapper.
  - Include module-only wildcard rules when testing the mapper, not just concrete weight names. For DeepSeek V4, a terminal shared_experts.w* rule must still cover the renamed down_proj and packed gate_up_proj.
  - The validated V4 mapper translates the terminal shared_experts.w* pattern to shared_experts.*; its packed-module mapping separately resolves gate_up_proj to w1 and w3.
  - Test wildcard and explicit w1/w2/w3 rules against both shared runtime projections so neither silently falls back to global FP8.
  - Do not add a model-specific rename path when the shared mapper can express the relationship.
required_checks: [load, inference, accuracy]
evidence:
  level: E2
  additional_validated_cases:
    - model_arch: deepseek_v4
      framework_version: 0.25.0+rocm723
      accelerator: gfx950
      tensor_parallel_size: 2
      level: E3
      failure: shared_expert_source_overrides_did_not_match_renamed_runtime_projections
      result: wildcard_and_explicit_source_rules_preserved_shared_mxfp4
      verification_scope: Four shared-mapping cases passed; full offline GSM8K passed with the combined V4 repairs.
      session_artifacts:
        - repairs/shared-mapping-test-before.log
        - repairs/shared-mapping-test-after.log
        - evaluation/quantized/attempt-4/stdout.log
