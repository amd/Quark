schema_version: 1
id: repair.quark.packed-modules-mapping.v1
domain: repair
kind: diagnostic_playbook
status: validated
applicability:
  framework: [vllm]
match:
  symptoms:
    - tensor size mismatch
    - excluded layers from the quark config are still being treated as quantized
    - "parameter.py|load_merged_column_weight|start ("
  keywords: [quark, packed_modules_mapping, gate_up_proj, qkv_proj]
summary: Check whether the model declares the fused projection mapping used by Quark loading.
guidance:
  - Compare the Quark path with the native or unquantized model mapping.
  - Add only structural gate/up or QKV mappings that the model actually fuses.
  - A merged-column bounds error is a diagnostic trigger, not proof of a mapping defect; compare the selected scheme and checkpoint scale shape before changing the mapping.
  - For DeepSeek V4, declare fused_wqa_wkv as [wq_a, wkv] and shared gate_up_proj as [w1, w3] so their source projection rules are resolved before the global fallback.
  - Verify that fused shards use compatible quantization schemes. A mixed-precision compressor needs separate projection handling rather than an unconditional fused mapping.
  - For draft or MTP Quark exports, rule out an exclude_layers recipe gap before changing vLLM.
required_checks: [load, inference, accuracy]
evidence:
  level: E2
  additional_validated_cases:
    - model_arch: deepseek_v4
      framework_version: 0.25.0+rocm723
      accelerator: gfx950
      tensor_parallel_size: 2
      level: E3
      failure: "start (0) + length (512) exceeds dimension size (4)"
      cause: fused_attention_fell_back_to_global_channel_fp8_instead_of_source_block_fp8
      result: structural_mapping_restored_source_scheme_selection
      verification_scope: Final full offline GSM8K passed with the combined V4 repairs.
      session_artifacts:
