  keywords: [quark, compressor, wkv, wgate, PTPC-FP8]
summary: Preserve separately quantized DeepSeek V4 compressor projections instead of forcing them into an unquantized fused projection.
guidance:
  - Inspect the exported configuration and tensor headers for compressor wkv and wgate before changing the loader; the validated case keeps wkv native and quantizes wgate with PTPC-FP8.
  - The original compressor constructs fused_wkv_wgate with quant_config=None and calls torch.mm directly, so it cannot consume the separate Quark weight scales or dynamic activation quantization.
  - For the Quark path, construct checkpoint-named wkv and wgate projections with their own resolved quantization schemes; dispatch quantized projections through their quantization method.
  - Preserve the native projection's FP32 computation and concatenate KV and gate outputs in the original order for the FP32 compressor state.
  - Update both attention and indexer compressor call sites to use the projection helper. In the model loader, keep separate checkpoint names when the fused destination parameter does not exist.
  - Keep the established fused path for non-Quark models. Do not invent a fused checkpoint scale or drop activation quantization by merely dequantizing weights into the old fused buffer.
  - This differs from a fused-indexer loading repair whose destination intentionally consumes dequantized weights; here the two projections retain different quantization behavior at inference.
  - Compare the quantized projection against an independent scaled FP32 calculation and verify native output preservation, then run eager/default TP load-inference and the original offline accuracy gate.
required_checks: [parameter_mapping, projection_numerics, native_output_preservation, load, inference, accuracy]
