summary: Port an existing FlyDSL kernel minimally, validate first, then tune and productionize its prewarm and scratch lifecycle.
guidance:
  - Start from the closest MFMA and layout match instead of rewriting the kernel.
  - Use one M-padding helper for runtime and prewarm.
  - Compile all shapes before allocating persistent scratch and never allocate in the captured hot path.
  - Ship tuned entries with a bounded fallback heuristic for untuned shapes.
