---
attributes:
    # domain to use for new ops
    domains: com.ryzenai
    xclbins: "stx_llama2_mladf_2x4x4_v2_gemmbfp16_silu_mul_mha_rms_rope_unified"
    op_namespaces: "hybrid"
    mladf_version: "v2"
    fuse_qkv: false
    lora: true
    buffer_factor: 2
    is_ttft: true
    total_seq_len: 4096
    prune_logits: true
    enable_model_hash: true
    offload_embedding: true
    dynamic_shape_list:
        - sequence_length_padded: 128
        - sequence_length_padded: 256
        - sequence_length_padded: 512
        - sequence_length_padded: 768
        - sequence_length_padded: 1024
        - sequence_length_padded: 1792
        - sequence_length_padded: 2048
        - sequence_length_padded: 2304
        - sequence_length_padded: 3072
# define the passes to run. These passes are defined in passes/ and are executed
# in order
passes:
    - fastgelu_to_gelu
    - hybrid_llm_pad_input_ids
    - hybrid_llm_embedding
    - hybrid_llm_depad_lmhead
    - hybrid_llm_prune_logits
    - normalize_matmulnbits
    - hybrid_llm_split_qkv
    - hybrid_llm_kv_cache_to_bf16:
        attributes:
            convert_kv_cache: false
    - hybrid_llm_to_dd
    #- initializers_to_bfloat16
    - remove_parallel_casts
    - simplify_casts
    - hybrid_llm_try_reorder_qkv
    - dd.llm_prefill_to_dd
    - remove_obsolete_lora_inputs
    - promote_slices
    - hybrid_llm_cast_logits
inherit_passes_after: !include [cleanup.yaml]
postprocess:
    - hybrid_llm_dynamic_pad_update
    - hybrid_llm_jit
