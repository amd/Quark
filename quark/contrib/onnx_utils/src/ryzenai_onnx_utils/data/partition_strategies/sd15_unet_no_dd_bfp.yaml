---
attributes:
    # domain to use for new ops
    domains: com.ryzenai
    # multiple xclbins for SDMatmul and SDConv. xclbins will be merged into one later
    xclbins: "stx_SD_unified_fastpm_2x4x4"
    op_namespaces: "sd15"
    model_type: SD15_UNET
    op_config: "ops-config.json"
# define the passes to run. These passes are defined in passes/ and are executed
# in order
passes:
# conv+add wait for fastpm and performance drop fix
    # - sd15.conv_add_to_sd_convadd
# conv
    - sd15.conv_to_sd_conv2d
    - sd_bfp.conv_bfp
# gemm
    - sd15.matmul_add_to_sd_gemm
# resize
    - sd15.resize_to_sd_resize
    - sd_bfp.resize_bfp
# matmul
    - sd15.matmul_to_sd_matmul
# groupnorm
    - sd15.groupnorm_to_sd_groupnorm
    - sd_bfp.groupnorm_bfp
# gemm_trans + flat mha v1.1
    - sd15.mha_to_sd_mha_with_gemm_trans
    - sd_bfp.gemm_bfp
# mha
    - sd15.mha_to_sd_mha
    - sd_bfp.mha_bfp
# layernorm
    - sd15.layernorm_to_sd_layernorm
    - sd_bfp.layernorm_bfp
# silu
    - sd15.sigmoid_mul_to_sd_silu
    - sd_bfp.silu_bfp
# gelu
    - sd15.gelu_to_sd_gelu
# add
    - sd15.add_to_sd_add
    - sd_bfp.add_bfp
# concat
    - sd15.concat_to_sd_concat
    - sd_bfp.concat_bfp
# mul
    - sd15.mul_to_sd_mul
    - sd_bfp.mul_bfp
# whitebox_checker
    - sd3.whitebox_checker
# weights shuffle
    - sd15.sdconv
    - sd15.sdgemm
    - sd15.sdmatmul
# set preemption and fastpm attr for sd nodes
    - sd15.set_preemption_fastpm_attr_for_sd_nodes
# below are the passes to simplify the graph
    - remove_parallel_casts
    - simplify_casts
    - remove_reshapes
    - remove_dangling_nodes
    - remove_unused_io
