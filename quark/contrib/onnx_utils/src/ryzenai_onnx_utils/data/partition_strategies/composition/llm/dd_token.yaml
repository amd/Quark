---
setup:
    - normalize_matmulnbits
    - hybrid_llm_split_qkv
    - hybrid_llm_skipsimplifiedlayernorm
    - fastgelu_to_gelu
    - quickgelu_to_sigmoid_mul
    - phi3_5.conv_to_nhwc_conv
    - gather_transposes
    - simplify_transposes
passes:
    - hybrid_llm_kv_cache_to_bf16
    # some models may need to skip this pass to keep rope unfused
    - hybrid_llm_gqa
    - hybrid_llm_gqa_flatmha
    - hybrid_llm_flatmlp
    - hybrid_llm_flatrmsadd
    - hybrid_llm_to_dd
    - flatmha_external_bufs
cleanup:
    - simplify_matmulnbits
