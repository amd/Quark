---
attributes:
    # domain to use for new ops
    domains: com.ryzenai
    xclbins: "/xclbin/stx/unet_vae_combined.xclbin"
    op_namespaces: "sdxlt"
# define the passes to run. These passes are defined in passes/ and are executed
# in order
passes:
    - mha_to_bfp_actmatmul_sm
    - conv_to_conv1x1_bfp_noqdq
    - conv_to_conv3x3_bfp_noqdq
    - nhwc_conv_to_conv
    - add_to_elwadd_noqdq
    - groupnorm_to_groupnorm_bfp_noqdq
    - groupnorm_to_groupnorm_noqdq
    - vae_transpose_opt_1
    - vae_transpose_opt_2
    - vae_transpose_opt_3
    - matmul_add_reshape_transpose_to_matmul_bfp_noqdq
    - bfp_matmul_noqdq.matmul_add_to_matmul_transpose_bfp_noqdq
    - bfp_matmul_noqdq.matmul_add_to_matmul_bfp_noqdq
    - float_to_bfp16ebs8
    - nhwc_resize_to_nni_noqdq
    - nchw_resize_to_nni_noqdq
    - block_to_gpn_noqdq
    - simplify_casts
    - remove_parallel_casts
    - simplify_transposes
    - remove_parallel_casts_bfp16
    # must be after remove_parallel_casts_bfp16
    - simplify_bfps
