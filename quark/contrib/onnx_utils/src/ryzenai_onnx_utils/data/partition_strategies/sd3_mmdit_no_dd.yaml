---
attributes:
    # domain to use for new ops
    domains: com.ryzenai
    xclbins: "stx_SD_unified_fastpm_2x4x4"
    op_namespaces: "sd3"
    model_type: SD30_MMDIT
    op_config: "ops-config.json"
# in order
passes:
# SDDITTBBF16/SDDITIBBF16/SDDITSIBBF16
    - sd3.ditfusion_sib_bf
    - sd3.ditfusion_tbib_bf
# gemm_gemm_mul_add
    - sd3.matmul_mul_add_to_sd_gemm_gemm_mul_add
# gemm_mul_add
    - sd3.matmul_mul_add_to_sd_gemm_mul_add
# pad
#     - sd3.dynamic_pad_mmdit
# silu
    - sd15.sigmoid_mul_to_sd_silu
# conv
    - sd3.pad_conv_ic
    - sd15.conv_to_sd_conv2d
# slice_gemm
    - sd3.slice_matmul_add_to_sd_slice_gemm
# slice
    - sd3.slice_to_sd_slice
# layernorm
    - sd15.layernorm_to_sd_layernorm
# resize
    - sd15.resize_to_sd_resize
# gemm
    - sd15.matmul_add_to_sd_gemm
# gemm_rn_concat + flash mha
    - sd3_5.mha_to_sd_mha_with_gemm_rmsnorm_concat_trans
# gemm_rn + flash mha
    - sd3_5.mha_to_sd_mha_with_gemm_rmsnorm_trans
# gemm_concat + flash mha
    - sd3.mha_to_sd_mha_with_gemm_concat_trans
# gemm_trans + flash mha
    - sd15.mha_to_sd_mha_with_gemm_trans
# mha
    - sd15.mha_to_sd_mha
# rmsnorm
    - sd3_5.rmsnorm_to_sd_rmsnorm
# concat
    - sd15.concat_to_sd_concat
# mul_add
    - sd3.mul_add_to_sd_mul_add
# mul
    - sd15.mul_to_sd_mul
# add
    - sd15.add_to_sd_add
# gelu
    - sd15.gelu_to_sd_gelu
# matmul
    - sd15.matmul_to_sd_matmul
# groupnorm
    - sd15.groupnorm_to_sd_groupnorm
# whitebox_checker
    - sd3.whitebox_checker
# weights shuffle
    - sd3.sdgemm_gemm_mul_add
    - sd3.sdgemm_mul_add
    - sd3.sdgemm_concat
    - sd15.sdconv
    - sd15.sdgemm
    - sd15.sdmatmul
# set preemption and fastpm attr for sd nodes
    - sd15.set_preemption_fastpm_attr_for_sd_nodes
# below are the passes to simplify the graph
    - simplify_casts
    - remove_reshapes
    - remove_parallel_casts
    - remove_dangling_nodes
    - remove_unused_io
