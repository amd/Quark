[build-system]
# Stock setuptools.build_meta. ``--no-build-isolation`` is the preferred install
# path: it reuses the active env's torch directly (no per-build re-download).
# Default isolation also works -- pip pulls torch via ``[build-system].requires``
# below; set ``PIP_EXTRA_INDEX_URL`` to override PyPI's default torch index for
# non-default accelerators (ROCm). ``QUARK_ACCELERATOR=cpu|cuda|rocm`` overrides
# the auto-detected family (e.g. CPU wheel from GPU-torch env). See CONTRIBUTING.md.
build-backend = "setuptools.build_meta"
requires = [
  "setuptools >= 61.0",
  "torch>=2.2.0",
]

[project]
authors = [{ name = 'AMD' }]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Intended Audience :: Education',
    'Intended Audience :: Science/Research',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
description = "AMD Quark is a comprehensive cross-platform toolkit designed to simplify and enhance the quantization of deep learning models. Supporting both PyTorch and ONNX models, AMD Quark empowers developers to optimize their models for deployment on a wide range of hardware backends, achieving significant performance gains without compromising accuracy."
dynamic = ["dependencies", "version"]
keywords = ["quantization", "pytorch", "onnx"]
license = {file = "LICENSE"}
maintainers = [
    { name = "AMD Quark Maintainers", email = "quark.maintainers@amd.com" },
]
name = "amd-quark"
readme = "README.md"
# Source of truth for supported Python versions. Read at build time by
# ``setup.py::_load_requires_python_spec()`` to gate cp-wheel vs universal
# fallback. Keep in sync with ``[project].classifiers`` below and the install
# docs (``docs/source/install.rst``, ``CONTRIBUTING.md``).
requires-python = ">=3.11,<3.14"

[project.urls]
documentation = "https://quark.docs.amd.com"
homepage = "https://github.com/amd/quark"
issues = "https://github.com/amd/quark/issues"
repository = "https://github.com/amd/quark.git"

[project.optional-dependencies]
lint = [
  "mypy==1.18.2",
  "opencv-python",
  "pre-commit",
  "pydantic",
  # Spellcheck engine. Version mirrors the CI spellcheck action
  # (.github/actions/spellcheck). Needs system aspell + aspell-en at runtime.
  "pyspelling==2.11",
  "pytest",
  "pyyaml",
  "ruff",
  "types-PyYAML",
]

profiling = [
  "PyYAML",
  "psutil",
]

flydsl = [
  # FlyDSL A8W4 / SVDQuant native inference backends, gfx950.
  # 0.2.4 is the validated version -- see the FlyDSL section of
  # docs/source/pytorch/pytorch_troubleshooting.rst for the full rationale (the GEMM is
  # vendored, so $FLYDSL_REPO is NOT a dependency; and do not downgrade to 0.1.2 for
  # aiter's unused flydsl kernels).
  #
  # A floor rather than an exact pin: this is published package metadata, so `==0.2.4`
  # would force version conflicts on anyone installing amd-quark alongside another
  # flydsl consumer. Use tools/ci/setup_flydsl.sh for a reproducible environment.
  "flydsl>=0.2.4,<0.3",
]

cli = [
  # Keep in sync with requirements-cli.txt at the repo root.
  "accelerate",
  "gguf",
  "immutabledict",
  "langdetect",
  "onnx",
  "onnx_ir",
  "onnxruntime>=1.22.2,<=1.28.0",
  "onnxruntime_extensions",
  "opencv-python",
  "Pillow",
  "protobuf",
  "psutil",
  "pulp>=3.3,<4",
  "py7zr",
  "pydantic",
  "rich",
  "rouge_score",
  "timm",
  "transformers>5,<5.17",
]

quant_perf = [
  "anthropic>=0.71,<1",
  "anyio>=4,<5",
  "claude-agent-sdk>=0.2.114,<0.3",
  "huggingface-hub>=1.5,<2",
  "lm-eval>=0.4.12,<0.5",
  "python-dotenv>=1,<2",
  "PyYAML>=6.0.3,<7",
  "requests>=2.31,<3",
  "safetensors>=0.6.2,<0.9",
  "transformers>=5.5.3,<5.14",
]

# Optional ONNX crypto mode (AES-256 model encryption). Floor pinned to
# 48.0.1 for GHSA-537c-gmf6-5ccf (vulnerable OpenSSL bundled in older wheels).
crypto = [
  "cryptography>=48.0.1",
]

[project.scripts]
quark-cli = "quark.experimental.cli.main:main"
quark-quant-perf = "quark.experimental.torch.quant_perf.cli:main"
quark-skills = "quark.skills:main"

[project.entry-points."vllm.general_plugins"]
# ATOM-style CLI for Quark online quant; disable with QUARK_DISABLE_VLLM_PLUGIN=1.
quark_online_quant = "quark.online_quantization.vllm.plugin:register"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
# `[project].dynamic = ["version"]` declares version as dynamic; the value is
# computed at build time by setup.py and passed via `setup(version=...)`. We
# deliberately do NOT use `attr = 'quark.__version__'` here: setuptools >= 82
# strictly PEP 440-validates that resolution path, and `setup.py` writes
# `quark/version.py` mid-run, so the attr resolver hits the `quark/__init__.py`
# fallback before it's overwritten and aborts metadata generation. Letting the
# `setup.py` kwarg be the single source of truth sidesteps that race entirely.

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "setup.py",
  "docs/source/conf.py",
  "quark/torch/algorithm/rotation/hadamard.py",
  # Vendored snapshot of the FlyDSL repo's a8w4 preshuffle GEMM, carrying the fused
  # SVD epilogue that is not upstream yet; kept diffable against upstream, so it is
  # neither reformatted nor relinted to Quark's style. The MFMA epilogue and pipeline
  # helpers it uses are imported from aiter instead of vendored.
  "quark/torch/kernel/flydsl/kernels/preshuffle_gemm.py",
]

[tool.ruff.lint]
select = [
  "B", # flake8-bugbear
  "C", # comprehension and complexity
  "E", # pycodestyle error
  "F", # Pyflakes
  "G", # flake8-logging-format
  "I", # isort
  "SIM", # flake8-simplify
  "UP", # pyupgrade
  "W", # pycodestyle warning
]
ignore = [
    "B006", # Do not use mutable data structures for argument defaults
    "B007", # loop variable not used in loop
    "C408", # Unnecessary `dict()` call (rewrite as a literal)
    "C419", # unnecessary list comprehension
    "C901", # function is too complex
    "E501",  # line too long
    "G003", # + in logging statements
    "G004", # f-strings in logging statements
    "SIM102", # use single if statement instead of nested
    "SIM103", # return the condition directly
    "SIM108", # use ternary operator instead of if-else
    "SIM210", # Remove unnecessary `True if ... else False`
    "SIM401", # use .get() instead of if
]

[tool.ruff.lint.per-file-ignores]
"test/test_for_torch/experimental/quant_perf/*.py" = ["SIM117"]
"test/test_for_torch/experimental/quant_perf/**/*.py" = ["SIM117"]
# extend-select = ["ALL"]

[tool.mypy]
strict = true
disable_error_code = ["method-assign", "unused-ignore"]
plugins = ['pydantic.mypy']
exclude_gitignore = true
exclude = ['^skills/']

[[tool.mypy.overrides]]
module = ["quark.*"]
allow_redefinition = true
disable_error_code = ["misc", "no-any-return", "arg-type", "index"]

[[tool.mypy.overrides]]
module = [
  "quark.torch.quantization.fake_quantize.*",
  "quark.onnx.*",
  "quark.onnxslim.*",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["quark.torch.quantization.observer.*"]
disallow_untyped_calls = false
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = [
  "examples.*",
  "quark.experimental.cli.quark_onnx.*",
  "quark.experimental.cli.torch_llm.llm_eval.*",
  "quark.experimental.cli.torch_llm.llm_ptq.*",
  "quark.experimental.cli.torch_llm.llm_utils.*",
  "quark.experimental.cli.torch_llm.module_replacement.*",
  "quark.torch.export.json_export.converter.*",
]
ignore_errors = true

# vLLM is an optional dependency; these modules import it for quantization support
[[tool.mypy.overrides]]
module = [
  "quark.experimental.torch.plugin.vllm_plugin",
  "quark.experimental.torch.plugin.fakequant_worker",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["quark.contrib.llm_eval.*"]
ignore_errors = true

# QAD/LoRA+KD dataset + task formatters: data-prep glue (many HF-dataset-shaped
# dict transforms), typed at the same level as the example layer (examples.*).
[[tool.mypy.overrides]]
module = ["quark.torch.algorithm.qad_trainer.datasets.*"]
ignore_errors = true

# Vendored FlyDSL GEMM (see the matching [tool.ruff] exclude): upstream DSL code
# that is kept diffable rather than annotated to Quark's strict-mypy standard.
[[tool.mypy.overrides]]
module = ["quark.torch.kernel.flydsl.kernels.preshuffle_gemm"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "accelerate.*",
  "aiter",
  "aiter.*",
  "anthropic",
  "anthropic.*",
  "bokeh.*",
  "brevitas.*",
  "claude_agent_sdk",
  "claude_agent_sdk.*",
  "compressed_tensors.*",
  "cv2",
  "datasets.*",
  "diffusers.*",
  "dotenv",
  "dotenv.*",
  "evaluate.*",
  "flydsl",
  "flydsl.*",
  "gguf.*",
  "google.*",
  "lm_eval.*",
  "matplotlib.*",
  "ml_dtypes.*",
  "nltk.*",
  "numpy.*",
  "onnx.*",
  "onnx_tool.*",
  "onnxruntime.*",
  "onnxruntime_extensions.*",
  "onnxruntime_genai.*",
  "onnxscript.*",
  "onnxslim.*",
  "optimum.*",
  "packaging",
  "packaging.version",
  "packaging.*",
  "pandas.*",
  "protobuf.*",
  "psutil.*",
  "pydantic.*",
  "pytest",
  "pytest.*",
  "PIL.*",
  "quark.contrib.*",
  "quark.version.*",
  "rich.*",
  "safetensors.*",
  "scipy.*",
  "sentencepiece.*",
  "six.*",
  "sympy.*",
  "timm.*",
  "torch.*",
  "TraceLens",
  "TraceLens.*",
  "transformers.*",
  "trl",
  "trl.*",
  "tqdm.*",
  "vllm",
  "vllm.*",
]
ignore_missing_imports = true

# TODO: Fix this
[[tool.mypy.overrides]]
module = "torch.*"
follow_imports = "skip"

# transformers builds class members dynamically: `PreTrainedConfig.__init__` is
# synthesized through `__init_subclass__` rather than declared, so following these
# imports makes mypy flag calls that succeed at runtime (`call-arg` on
# `super().__init__(tie_word_embeddings=...)`) plus `no-untyped-call` on the generated
# hooks. torch.* is skipped for the same class of reason. The cost is that HF symbols
# degrade to `Any`, so overrides of HF base classes are no longer signature-checked;
# the forward-equivalence and cache tests cover that at runtime instead.
[[tool.mypy.overrides]]
module = "transformers.*"
follow_imports = "skip"

[tool.coverage.paths]
# Treat the quark package wherever it was measured as the in-repo quark/ tree so
# coverage reports repo-relative paths that diff-cover can match against the PR
# git diff -- even when tests run against a wheel install (the CI coverage legs
# install the prebuilt/built wheel, not an editable checkout, so the package is
# imported from site-packages). The first entry is canonical and must exist on
# the reporting machine (the repo checkout); a remap is only applied when the
# rewritten path exists there. '*/site-packages/...' is auto-promoted to
# '**/site-packages/...' by coverage, so it matches the full absolute path.
# Applied at `coverage combine` (torch/onnx/contrib/all legs) and at single-file
# reporting (`coverage xml`) for the cli/ci legs. Pairs with relative_files below.
source = [
  "quark/",
  "*/site-packages/quark/",
]

[tool.coverage.run]
  branch = true
  relative_files = true
  omit = [
    "*/quark/onnx/tools/*",
    "*/quark/torch/kernel/mx/triton.py",
    # Vendored snapshot of the FlyDSL repo's a8w4 preshuffle GEMM, kept diffable
    # against upstream (see the matching [tool.ruff] exclude and mypy override).
    # Its traced kernel bodies are only reachable by exercising every tile config on
    # gfx950, so measuring upstream DSL source here reports a testing gap that is not
    # ours to close.
    "*/quark/torch/kernel/flydsl/kernels/preshuffle_gemm.py",
    "*/test/*",
    # Residual in-source test scaffolds (run as __main__ scripts, not collected by pytest).
    "*/quark/onnx/algorithm/finetuning/torch_utils_test.py",
    "*/quark/onnx/algorithm/finetuning/create_torch/create_model_test.py",
    "*/quark/onnx/optimizations/model_transformer_test.py",
    # Legacy / inactive ONNX modules: no live call-sites in the supported
    # quantization pipelines, so they sit at 0% coverage and drag the
    # headline number down without representing a real testing gap. Re-add
    # measurement here once any of these modules is wired back in.
    "*/quark/onnx/optimizations/model_transformer.py",
    "*/quark/onnx/optimizations/convert_transforms.py",
    "*/quark/onnx/optimizations/transforms.py",
    "*/quark/onnx/optimizations/convert_transforms_pipeline.py",
    "*/quark/onnx/optimizations/transforms_pipeline.py",
    "*/quark/onnx/postprocess/simulation/simulate_dpu_softmax.py",
  ]
  # concurrency = multiprocessing

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self\\.debug",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise ValueError",
  "raise NotImplementedError",
  "raise FileNotFoundError",
  "raise RuntimeError",
  "raise ImportError",
  "raise ModuleNotFoundError",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",

  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",
  ]

[tool.pytest.ini_options]
# Drop rootdir ("."): leaving it on the path would shadow the wheel-installed
# copy of quark/ with the source tree, so AOT-precompiled kernels (PR #5501)
# would never be exercised.
pythonpath = [".github/scripts", "test"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "-vvvvv",
  "-s"]
markers = [
  "accelerate_test: Tests which requires `accelerate` library to run.",
  "flydsl_gfx950: FlyDSL hardware tests requiring a gfx950 GPU",
  "require_dual_gpu: Tests which requires two GPU devices to run",
  "tensor_parallel: Tests for the Tensor Parallel feature",
]
