# # omit anything in a .local directory anywhere
# */.local/*
# # omit everything in /usr
# /usr/*
# # omit this single file
# utils/tirefire.py
[coverage:run]
omit =
    */quark/onnx/tools/*
    */quark/torch/kernel/mx/triton.py
#concurrency = multiprocessing

[coverage:report]
exclude_also =
    raise ValueError
    raise NotImplementedError
    raise FileNotFoundError
    raise RuntimeError
    raise ImportError
    raise ModuleNotFoundError

# TODO (tfernand): Move this to pyproject.toml
[tool:pytest]
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    accelerate_test: Tests which requires `accelerate` library to run.
    require_dual_gpu: Tests which requires two GPU devices to run
    tensor_parallel: Tests for the Tensor Parallel feature

# different runners have different workspace
[coverage:paths]
source =
    ../
    /scratch/actions-runner*/AMDNeuralOpt/_work/Quark/Quark
    /scratch/actions-runner*/_work/Quark/Quark
