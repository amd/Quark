# # omit anything in a .local directory anywhere
# */.local/*
# # omit everything in /usr
# /usr/*
# # omit this single file
# utils/tirefire.py
[coverage:run]
omit =
    */quark/onnx/tools/*

[coverage:report]
exclude_also =
    raise ValueError
    raise NotImplementedError
    raise FileNotFoundError
    raise RuntimeError
    raise ImportError
    raise ModuleNotFoundError

[tool:pytest]
markers =
    accelerate_test:The tests that require the `accelerate` library to be run.

# different runners have different workspace
[coverage:paths]
source =
    ../
    /scratch/actions-runner*/AMDNeuralOpt/_work/Quark/Quark
    /scratch/actions-runner*/_work/Quark/Quark
